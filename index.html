<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طنط سارة لينكات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Lalezar&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a girly gamer's link page, soft and glowing like the reference
   IDEA a mauve night garden: rose-framed cover, butterflies drifting up instead of stars
   PICTURE the cover banner with roses and her logo, a glowing round avatar breaking its edge
   COLOUR deep plum ground, mauve and rose pink glow, blush accent
   TYPE Aref Ruqaa for her name, Almarai for links
   LAYOUT one 640px column centred, rows with round glowing icons, same on phone */
:root{color-scheme:dark;--bg:#1a0b24;--bg2:#2a1236;--ink:#fbeefe;--soft:#d9bfe6;--mauve:#c38ad8;--rose:#ff8fc0;--blush:#ffd3e6;--row:rgba(255,255,255,.04)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,#3a1748 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.55 'Almarai',system-ui,sans-serif;overflow-x:clip;min-height:100vh}
a{color:inherit;text-decoration:none}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fly{position:absolute;bottom:-60px;animation:up linear infinite}
.fly svg{display:block}
.fly .wl,.fly .wr{transform-box:fill-box;animation:flap .32s ease-in-out infinite alternate}
.fly .wl{transform-origin:100% 50%}.fly .wr{transform-origin:0 50%}
@keyframes flap{to{transform:scaleX(.25)}}
@keyframes up{0%{transform:translate(0,0) rotate(-8deg);opacity:0}10%{opacity:.95}50%{transform:translate(40px,-55vh) rotate(8deg)}90%{opacity:.9}100%{transform:translate(-20px,-112vh) rotate(-6deg);opacity:0}}
.petal{position:absolute;top:-30px;width:12px;height:16px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,var(--rose),#c25a9a);opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,112vh) rotate(540deg)}}
.dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe3f2;box-shadow:0 0 8px 2px rgba(255,170,215,.7);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.spk{position:absolute;display:block;animation:twk ease-in-out infinite}
.spk svg{display:block;width:100%;height:100%}
@keyframes twk{0%,100%{transform:scale(.2) rotate(0);opacity:0}45%{transform:scale(1) rotate(45deg);opacity:1}60%{transform:scale(.85) rotate(60deg);opacity:.9}}
.trail{position:absolute;width:14px;height:14px;animation:twk 1.6s ease-in-out infinite}
.trail svg{width:100%;height:100%;display:block}
.cover .spk{z-index:3}
@media(prefers-reduced-motion:reduce){.spk,.trail{animation:none!important;opacity:.8}.fly,.petal,.dot,.fly .wl,.fly .wr,.ring{animation:none!important}.fly,.petal{display:none}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:22px max(4vw,14px) 40px}
.cover{position:relative;height:clamp(170px,46vw,250px);border-radius:26px;overflow:hidden;background:#100f2f;box-shadow:0 0 0 1px rgba(255,200,235,.25),0 0 40px rgba(200,120,220,.35)}
.cover svg.bgart{position:absolute;z-index:1;inset:0;width:100%;height:100%}
.corner{position:absolute;width:clamp(84px,22vw,150px);height:auto}.corner.tr{top:0;right:0}.corner.bl{bottom:0;left:0}
.ban{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:85% 50%}
.bgart{z-index:1}.corner{z-index:2}
.logo{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 22%}
.logo img{max-width:100%;max-height:78%;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(60,0,60,.5))}
.logo .ph b{display:block;font:700 clamp(34px,9vw,54px)/1.05 'Aref Ruqaa',serif;color:#fff;text-shadow:0 0 18px rgba(255,170,220,.9),0 3px 0 #6a2a80}
.logo .ph span{display:inline-block;margin-top:6px;font-weight:800;font-size:clamp(11px,2.8vw,13px);letter-spacing:.06em;color:#4a1458;background:var(--blush);border-radius:999px;padding:3px 12px;direction:ltr;white-space:nowrap}
.head{position:relative;display:flex;align-items:flex-end;gap:14px;margin-top:-74px;padding:0 14px}
.av{position:relative;flex:none;width:150px;height:150px;border-radius:50%;display:grid;place-items:center}
.ring{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,#ff6fd0,#b36bff,#ff6fd0);animation:spin 6s linear infinite;box-shadow:0 0 22px 4px rgba(220,110,240,.6)}
@keyframes spin{to{transform:rotate(360deg)}}
.av .in{position:relative;width:100%;height:100%;border-radius:50%;background:#100f2f;border:0;display:grid;place-items:center;font-size:58px;overflow:hidden}
.av .in img{width:100%;height:100%;object-fit:cover;display:block}
.av::before{content:'';position:absolute;inset:-11px;border-radius:50%;background:#1d0c28}
.av .spk{z-index:2}
.av .bf{position:absolute;top:-10px;left:-14px;width:44px;transform:rotate(-18deg)}
.tools{display:flex;gap:10px;margin-bottom:6px}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,200,235,.35);background:rgba(40,12,52,.75);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:hover,.ib:focus-visible{border-color:var(--rose);box-shadow:0 0 14px rgba(255,140,200,.6);outline:none}
.ib svg{width:22px;height:22px}
.who{margin:14px 14px 0}
h1{margin:0;font:400 clamp(32px,8vw,42px)/1.2 'Lalezar',sans-serif;color:#fff;text-shadow:0 0 14px rgba(255,140,210,.55)}
.bio{margin:4px 0 0;color:var(--soft)}
.links{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:12px}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) 44px;align-items:center;gap:10px;min-height:76px;padding:8px 10px;border-radius:22px;background:rgba(48,16,64,.86);border:1px solid rgba(255,190,235,.3);box-shadow:0 6px 18px rgba(8,0,14,.45);transition:border-color .15s,transform .15s}
.row:hover,.row:focus-within{border-color:var(--rose);transform:translateY(-2px)}
.row>a.main,.row>button.main{grid-column:1/3;display:grid;grid-template-columns:58px minmax(0,1fr);align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:center;cursor:pointer;min-height:58px}
.row>a.main:focus-visible,.row>button.main:focus-visible{outline:2px solid var(--rose);outline-offset:4px;border-radius:14px}
.ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#4a1d5c,#22092e);box-shadow:0 0 0 2px var(--c,var(--mauve)),0 0 18px 2px color-mix(in srgb,var(--c,var(--mauve)) 70%,transparent),inset 0 0 12px color-mix(in srgb,var(--c,var(--mauve)) 45%,transparent)}
.ic svg{width:30px;height:30px}
.lbl{font-weight:800;font-size:17px;line-height:1.35;color:#fff}
.lbl small{display:block;font-weight:400;font-size:13px;color:#ecd6f5}
.sh{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--soft);display:grid;place-items:center;cursor:pointer}
.sh:hover,.sh:focus-visible{color:var(--rose);outline:none;background:var(--row)}
.sh svg{width:20px;height:20px;transition:transform .2s}
.row.open .sh.ch svg{transform:rotate(180deg)}
.sub{grid-column:1/-1;display:none;gap:6px;padding:4px 6px 6px 50px}
.row.open .sub{display:grid}
.sub a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,200,235,.18);font-weight:700}
.sub a span{direction:ltr;color:var(--soft);font-weight:400;font-size:13px}
.sub a:hover,.sub a:focus-visible{border-color:var(--rose);outline:none}
.code{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:-4px 0 4px}
.code b{direction:ltr;letter-spacing:.12em;font-size:18px;padding:8px 16px;border-radius:12px;border:1px dashed var(--rose);color:var(--blush)}
.cp{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:linear-gradient(90deg,var(--rose),var(--mauve));color:#2a0a30;font:800 14px 'Almarai',sans-serif;cursor:pointer}
.cp:focus-visible{outline:2px solid #fff;outline-offset:2px}
.soc{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:28px 0 0}.soc .ic{width:50px;height:50px}.soc .ic:hover,.soc .ic:focus-visible{transform:translateY(-3px);outline:none}
footer{position:relative;z-index:1;text-align:center;color:var(--soft);font-size:13px;padding:10px 16px 30px}
.toast{position:fixed;z-index:5;inset-inline:0;bottom:20px;margin:0 auto;width:max-content;max-width:90vw;background:var(--blush);color:#3a0f45;font-weight:800;padding:10px 18px;border-radius:999px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.modal{position:fixed;inset:0;z-index:4;display:none;place-items:center;background:rgba(15,4,20,.72);padding:16px}
.modal.on{display:grid}
.qrbox{background:#fff;color:#3a0f45;border-radius:26px;padding:20px;text-align:center;width:min(320px,100%);box-shadow:0 0 40px rgba(255,140,200,.5)}
.qrbox #qr svg{width:100%;height:auto;display:block}
.qrbox p{margin:10px 0 12px;font-weight:800}
@media(max-width:420px){.head{padding:0 6px}.av{width:128px;height:128px}.av .in{font-size:48px}.row{grid-template-columns:54px minmax(0,1fr) 44px;padding:8px 4px}.row>a.main,.row>button.main{grid-template-columns:54px minmax(0,1fr)}.sub{padding-left:6px}}
</style>
</head>

  fb:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1877f2"/><path d="M13.3 21.9v-7h2.4l.4-2.8h-2.8v-1.8c0-.8.3-1.4 1.4-1.4h1.5V6.4c-.3 0-1.2-.1-2.2-.1-2.2 0-3.6 1.3-3.6 3.7v2.1H8v2.8h2.4v7z" fill="#fff"/></svg>'

  {i:'wa', c:'#25d366', t:'قناة الواتساب', s:'آخر الأخبار', u:'https://whatsapp.com/channel/0029Vb6FHdE0gcfK4IvIKS3s'},

  {i:'sale', c:'#b8ff6a', t:'خصم أورايمو', s:'استخدموا الكود ده على الموقع', u:'https://eg.oraimo.com/?affiliate_code=9sxvnt5k', code:'Tsa10'}
];
const S = [
  {i:'tt', c:'#ff8fc0', t:'تيك توك', u:'https://www.tiktok.com/@tant..sara'},
  {i:'yt', c:'#ff5f8f', t:'يوتيوب', u:'https://youtube.com/@tantsara'},
  {i:'ig', c:'#ffb3d5', t:'إنستجرام', u:'https://www.instagram.com/tant_sara1/'},

  {i:'dc', c:'#a98bff', t:'ديسكورد', u:'https://discord.gg/khsjjdRy'}
];
const SH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>';
const CH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>';
const inner = x => `<span class="ic" style="--c:${x.c}">${P[x.i]}</span><span class="lbl">${x.t}${x.s?`<small><bdi>${x.s}</bdi></small>`:''}</span>`;
document.getElementById('links').innerHTML = L.map((x,n) => x.sub
  ? `<li class="row" id="r${n}"><button class="main" aria-expanded="false" data-tog="${n}">${inner(x)}</button><button class="sh ch" data-tog="${n}" aria-label="افتح ${x.t}">${CH}</button><div class="sub">${x.sub.map(s=>`<a href="${s[2]}">${s[0]}<span>${s[1]}</span></a>`).join('')}</div></li>`
  : `<li class="row"><a class="main" href="${x.u}">${inner(x)}</a><button class="sh" data-share="${x.u}" data-t="${x.t}" aria-label="شارك ${x.t}">${SH}</button>${x.code?`<div class="code"><b>${x.code}</b><button class="cp" data-copy="${x.code}">انسخ الكود</button></div>`:''}</li>`
).join('');
document.getElementById('soc').innerHTML = S.map(x => `<a class="ic" style="--c:${x.c}" href="${x.u}" aria-label="${x.t}">${P[x.i]}</a>`).join('');

const toast = document.getElementById('toast'); let tt;
const show = m => { toast.textContent = m; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 1800); };
const copy = async (v, m) => { try { await navigator.clipboard.writeText(v); show(m); } catch (e) { show(v); } };
const share = async (url, title) => {
  try { if (navigator.share) { await navigator.share({title, url}); return; } } catch (e) { if (e.name === 'AbortError') return; }
  copy(url, 'اتنسخ اللينك 🦋');
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tog],[data-share],[data-copy]'); if (!t) return;
  if (t.dataset.tog) { const r = document.getElementById('r' + t.dataset.tog); const o = r.classList.toggle('open'); r.querySelector('.main').setAttribute('aria-expanded', o); }
  else if (t.dataset.share) share(t.dataset.share, t.dataset.t);
  else copy(t.dataset.copy, 'اتنسخ الكود: ' + t.dataset.copy);
});
document.getElementById('shareBtn').addEventListener('click', () => share(location.href, 'طنط سارة'));
const modal = document.getElementById('modal');
document.getElementById('qrBtn').addEventListener('click', () => {
  try { const q = qrcode(0, 'M'); q.addData(location.href); q.make(); document.getElementById('qr').innerHTML = q.createSvgTag({cellSize: 6, margin: 2}); }
  catch (e) { document.getElementById('qr').textContent = location.href; }
  modal.classList.add('on');
});
document.getElementById('qrClose').addEventListener('click', () => modal.classList.remove('on'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('on'); });

const sky = document.getElementById('sky'); let seed = 7;
const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
let h = '';
for (let i = 0; i < 26; i++) h += `<span class="dot" style="left:${r()*100}%;top:${r()*100}%;animation-delay:${-r()*3}s"></span>`;
for (let i = 0; i < 9; i++) { const s = 26 + r() * 22; h += `<div class="fly" style="left:${r()*92}%;animation-duration:${16+r()*14}s;animation-delay:${-r()*30}s"><svg width="${s}" height="${s*.7}" viewBox="-32 -22 64 42"><use href="#bfly"/></svg><span class="trail" style="left:${s*.2}px;top:${s*.75}px"><svg viewBox="-12 -12 24 24"><use href="#spark"/></svg></span><span class="trail" style="left:${s*.6}px;top:${s*1.05}px;width:9px;height:9px;animation-delay:-.8s"><svg viewBox="-12 -12 24 24"><use href="#spark"/></svg></span></div>`; }
for (let i = 0; i < 34; i++) { const z = 10 + r() * 18; h += `<span class="spk" style="left:${r()*100}%;top:${r()*100}%;width:${z}px;height:${z}px;animation-duration:${2.2+r()*2.6}s;animation-delay:${-r()*5}s"><svg viewBox="-12 -12 24 24"><use href="#spark"/></svg></span>`; }
for (let i = 0; i < 10; i++) h += `<span class="petal" style="left:${r()*100}%;animation-duration:${12+r()*12}s;animation-delay:${-r()*24}s"></span>`;
sky.innerHTML = h;
}
